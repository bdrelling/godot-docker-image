name: Prune Container Images

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Prune Container Images
        uses: dataaxiom/ghcr-cleanup-action@v1.0.16
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: godot
          delete-untagged: true
          # Preserve stable manifests and their architecture/attestation children.
          exclude-tags: 'latest,*-stable'
          older-than: '7 days'
