name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - 'godot-versions.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'godot-versions.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Catalog version to rebuild (blank builds all); only main publishes'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: godot-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate updater and installers
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/install_godot.sh scripts/install_godot_export_templates.sh
          make info
          make -n build
      - name: Select versions
        id: versions
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          supported_versions_json=$(python3 scripts/godot_versions.py matrix --version "$REQUESTED_VERSION")
          latest_version=$(python3 scripts/godot_versions.py latest)
          echo "matrix=$supported_versions_json" >> "$GITHUB_OUTPUT"
          echo "latest=$latest_version" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures; publish version tag on main
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GODOT_VERSION=${{ matrix.version }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ghcr.io/bdrelling/godot:${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=godot-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=godot-${{ matrix.version }}

  latest:
    needs: [versions, build]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      contains(fromJSON(needs.versions.outputs.matrix), needs.versions.outputs.latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote latest only after every version succeeds
        env:
          LATEST_VERSION: ${{ needs.versions.outputs.latest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_latest_version=$(
            gh api "repos/$GITHUB_REPOSITORY/contents/godot-versions.json?ref=main" \
              -H 'Accept: application/vnd.github.raw+json' |
              python3 -c 'import json, sys; print(json.load(sys.stdin)[-1])'
          )
          if [ "$current_latest_version" != "$LATEST_VERSION" ]; then
            echo 'Main now tracks another latest version; leave promotion to its build.'
            exit 0
          fi
          docker buildx imagetools create \
            --tag ghcr.io/bdrelling/godot:latest \
            "ghcr.io/bdrelling/godot:$LATEST_VERSION"
